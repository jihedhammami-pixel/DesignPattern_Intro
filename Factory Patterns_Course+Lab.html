<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Patterns Lab · Java 25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --glass: rgba(255,255,255,.5);
  --glass-2: rgba(255,255,255,.72);
  --stroke: rgba(255,255,255,.85);
  --line: rgba(18,50,74,.12);
  --text: #12324a;
  --muted: #5a7a90;
  --fm1:#f97362; --fm2:#f5a142;
  --af1:#22b8cc; --af2:#6c8cff;
  --ok:#10b981; --bad:#f43f5e; --gold:#f59e0b;
  --grad-fm: linear-gradient(135deg,var(--fm1),var(--fm2));
  --grad-af: linear-gradient(135deg,var(--af1),var(--af2));
  --grad-ok: linear-gradient(135deg,#34d399,#22b8cc);
  --accent: var(--fm1); --grad: var(--grad-fm);
  --shadow: 0 18px 50px rgba(30,90,120,.14);
  --code-bg: rgba(14,32,48,.9); --code-tx:#e6f4f8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Outfit,system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,#eaf6fb,#e4f6f1 55%,#eef1fb);background-attachment:fixed;overflow-x:hidden}
#bg3d{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#sprog{position:fixed;top:0;left:0;height:4px;width:0;z-index:40;background:linear-gradient(90deg,#22b8cc,#6c8cff,#f97362);border-radius:0 4px 4px 0;box-shadow:0 0 12px rgba(34,184,204,.6)}
.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:18px 18px 60px}

/* Header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:12px}
.logo-cube{width:46px;height:46px;border-radius:14px;background:conic-gradient(from 200deg,#22b8cc,#6c8cff,#f97362,#f5a142,#34d399,#22b8cc);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px rgba(34,184,204,.35);animation:spin 14s linear infinite}
.logo-cube span{animation:spin 14s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.logo h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.logo h1 b{background:linear-gradient(90deg,#0e8fa3,#4f6ff0,#e8604f);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;color:var(--muted);font-size:13px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(30,90,120,.08)}
.pill .xp{background:linear-gradient(90deg,#f59e0b,#e8604f);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.ring{width:26px;height:26px}

/* Window tabs */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tab{position:relative;cursor:pointer;border:1px solid var(--stroke);border-radius:18px;padding:12px 14px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--text);text-align:left;font:inherit;transition:transform .25s,background .25s,box-shadow .25s;overflow:hidden;box-shadow:0 6px 18px rgba(30,90,120,.08)}
.tab:hover{transform:translateY(-2px);background:var(--glass-2)}
.tab .dots{display:flex;gap:5px;margin-bottom:6px}
.tab .dots i{width:8px;height:8px;border-radius:50%;background:rgba(18,50,74,.18)}
.tab .t{color:var(--text);font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.tab .s{font-size:12px;color:var(--muted)}
.tab .bar{height:4px;border-radius:4px;background:rgba(18,50,74,.1);margin-top:8px;overflow:hidden}
.tab .bar b{display:block;height:100%;width:0;border-radius:4px;transition:width .6s}
.tab[data-fam=fm] .bar b{background:var(--grad-fm)}
.tab[data-fam=af] .bar b{background:var(--grad-af)}
.tab.active[data-fam=fm]{background:linear-gradient(135deg,rgba(249,115,98,.22),rgba(245,161,66,.16)),var(--glass-2);border-color:rgba(249,115,98,.55);box-shadow:0 10px 30px rgba(249,115,98,.2)}
.tab.active[data-fam=af]{background:linear-gradient(135deg,rgba(34,184,204,.2),rgba(108,140,255,.18)),var(--glass-2);border-color:rgba(34,184,204,.55);box-shadow:0 10px 30px rgba(34,184,204,.2)}
.tab.active .dots i:nth-child(1){background:#ff5f57}.tab.active .dots i:nth-child(2){background:#febc2e}.tab.active .dots i:nth-child(3){background:#28c840}

/* mouse spotlight on glass */
.tab::after,.window::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(420px circle at var(--mx,50%) var(--my,-30%),rgba(255,255,255,.55),transparent 45%);opacity:var(--spot,0);transition:opacity .4s;z-index:0}
.window>*{position:relative;z-index:1}

/* Window */
.window{position:relative;border:1px solid var(--stroke);border-radius:24px;background:rgba(255,255,255,.42);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}}
.titlebar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.35)}
.titlebar .dots{display:flex;gap:7px}.titlebar .dots i{width:12px;height:12px;border-radius:50%}
.titlebar .dots i:nth-child(1){background:#ff5f57}.titlebar .dots i:nth-child(2){background:#febc2e}.titlebar .dots i:nth-child(3){background:#28c840}
.titlebar .wt{font-weight:700}
.titlebar .ws{color:var(--muted);font-size:13px;margin-left:auto}
.wbody{display:grid;grid-template-columns:250px 1fr;min-height:560px}
.side{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.22)}
.side h4{margin:4px 6px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.stepbtn{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;color:var(--text);font:inherit;padding:9px 10px;border-radius:12px;cursor:pointer;text-align:left;transition:.2s;font-size:14px}
.stepbtn:hover:not(:disabled){background:rgba(255,255,255,.55)}
.stepbtn:disabled{opacity:.4;cursor:not-allowed}
.stepbtn .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid var(--line);background:rgba(255,255,255,.6)}
.stepbtn.cur{background:rgba(255,255,255,.7);border-color:var(--stroke);box-shadow:0 4px 14px rgba(30,90,120,.08)}
.stepbtn.cur .n{background:var(--grad);border-color:transparent;color:#fff}
.stepbtn.done .n{background:var(--grad-ok);border-color:transparent;color:#fff}
.main{padding:26px 30px;min-width:0}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2.st{font-size:30px;margin:4px 0 14px;letter-spacing:-.02em;font-weight:800}
h2.st span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.main p{line-height:1.6;font-size:16.5px;margin:10px 0;color:var(--text)}
code.i{font-family:'JetBrains Mono',monospace;font-size:.86em;background:rgba(34,184,204,.12);padding:2px 7px;border-radius:7px;color:#0b6f80}
.big{border-radius:18px;padding:16px 18px;margin:14px 0;background:rgba(255,255,255,.6);border:1px solid var(--stroke);font-size:17px;line-height:1.55;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(30,90,120,.06)}
.big::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grad)}
.analogy{display:flex;gap:14px;align-items:flex-start;border-radius:18px;padding:14px 16px;margin:14px 0;background:linear-gradient(135deg,rgba(254,240,200,.75),rgba(255,247,230,.6));border:1px solid rgba(245,158,11,.35)}
.analogy .ic{font-size:30px;line-height:1}
.analogy b{color:#b45309}
.card{border-radius:18px;padding:16px;background:var(--glass);border:1px solid var(--stroke);box-shadow:0 6px 20px rgba(30,90,120,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.btn{font:inherit;font-weight:700;border:none;cursor:pointer;color:#fff;padding:11px 18px;border-radius:14px;background:var(--grad);box-shadow:0 8px 20px rgba(30,90,120,.18);transition:.2s;display:inline-flex;align-items:center;gap:8px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:rgba(255,255,255,.65);color:var(--text);border:1px solid var(--stroke);box-shadow:0 4px 12px rgba(30,90,120,.08);text-shadow:none}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font:inherit;cursor:pointer;border:1px solid var(--stroke);background:rgba(255,255,255,.6);color:var(--text);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;transition:.2s}
.chip:hover:not(:disabled){background:rgba(255,255,255,.9)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(30,90,120,.18);text-shadow:0 1px 2px rgba(0,0,0,.15)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px;flex-wrap:wrap}
.sim{border-radius:20px;padding:18px 16px 16px;margin:18px 0 14px;background:rgba(255,255,255,.38);border:1px solid var(--stroke);position:relative}
.sim .lbl{position:absolute;top:-11px;left:16px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--grad);color:#fff}

/* Code (stays dark for readability) */
.code{border-radius:16px;overflow:hidden;border:1px solid rgba(18,50,74,.2);background:var(--code-bg);color:var(--code-tx);margin:12px 0;font-family:'JetBrains Mono',monospace;font-size:13.5px;box-shadow:0 10px 26px rgba(14,32,48,.18)}
.code-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.1);font-size:12px;color:#9fb8c8}
.code-head .copy{margin-left:auto;font:inherit;font-size:12px;cursor:pointer;color:var(--code-tx);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:3px 9px}
.code pre{margin:0;padding:10px 0;overflow:auto;max-height:520px}
.ln{display:flex;padding:0 14px 0 0;line-height:1.65;transition:background .25s;white-space:pre;border-left:3px solid transparent}
.ln .no{flex:none;width:38px;text-align:right;padding-right:14px;color:rgba(255,255,255,.28);user-select:none}
.ln.hl{background:linear-gradient(90deg,rgba(250,204,21,.25),rgba(250,204,21,.02));border-left-color:#facc15}
.ln.role{background:linear-gradient(90deg,rgba(255,255,255,.16),transparent);border-left-color:var(--accent)}
.ln.dim{opacity:.35}
.k{color:#ff8fb3;font-weight:600}.t{color:#67e8f9}.s{color:#bef264}.c{color:#8ba3b5;font-style:italic}.a{color:#fbbf24}.f{color:#fdba74}
.code-pre{margin:0;padding:14px 16px;white-space:pre;overflow:auto;line-height:1.75}
.blank{font:inherit;font-size:13px;color:#fde68a;background:rgba(250,204,21,.1);border:1px dashed rgba(250,204,21,.6);border-radius:7px;padding:1px 6px;outline:none;min-width:60px}
.blank:focus{border-style:solid;box-shadow:0 0 0 3px rgba(250,204,21,.2)}
.blank.ok{border:1px solid #34d399;color:#a7f3d0;background:rgba(52,211,153,.12)}
.blank.no{border:1px solid #fb7185;background:rgba(251,113,133,.15)}
.console{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--code-bg);border-radius:12px;padding:10px 12px;min-height:44px;color:#a7f3d0}
.console div{animation:pop .3s}
.console .pr{color:#8ba3b5}
.tip{display:inline-flex;gap:8px;align-items:center;font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(34,184,204,.12);border:1px solid rgba(34,184,204,.35);color:#0b6f80;margin:6px 0}

/* Quiz */
.quiz{margin-top:22px;border-radius:20px;padding:18px;background:linear-gradient(135deg,rgba(108,140,255,.14),rgba(34,184,204,.12)),rgba(255,255,255,.5);border:1px solid rgba(108,140,255,.35);position:relative}
.quiz .qh{display:flex;gap:10px;align-items:center;font-weight:700;color:#4f6ff0;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.quiz .q{font-size:18px;font-weight:600;margin:8px 0 12px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;cursor:pointer;color:var(--text);background:rgba(255,255,255,.7);border:1px solid var(--stroke);padding:11px 14px;border-radius:14px;font-size:15.5px;transition:.2s;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){background:#fff;transform:translateX(3px)}
.opt .L{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(18,50,74,.08);font-weight:700;font-size:13px}
.opt.right{background:rgba(16,185,129,.16);border-color:var(--ok)}
.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{background:rgba(244,63,94,.12);border-color:var(--bad);animation:shake .4s}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:15px;line-height:1.5;border-radius:12px;padding:10px 12px;display:none}
.fb.show{display:block;animation:pop .3s}
.fb.good{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4)}
.fb.badf{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.35)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* FM sims */
.files{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0 12px}
.file{border-radius:12px;padding:10px;background:rgba(255,255,255,.7);border:1px solid var(--stroke);font-size:12px;transition:.3s}
.file b{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.file code{font-family:'JetBrains Mono',monospace;font-size:11px;color:#b45309}
.file.hot{border-color:var(--bad);background:rgba(244,63,94,.12);animation:shake .5s;box-shadow:0 0 20px rgba(244,63,94,.25)}
.status{font-weight:700;font-size:16px;min-height:24px;margin-top:6px}
.factory{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:10px;margin:14px 0}
.machine{height:110px;border-radius:18px;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-align:center;box-shadow:0 10px 26px rgba(30,90,120,.2);position:relative;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.machine .gear{font-size:34px;display:inline-block}
.machine.run .gear{animation:spin 1s linear infinite}
.machine.run{animation:pulse .5s ease-in-out 3}
.machine small{font-weight:500;opacity:.95;font-size:11.5px}
@keyframes pulse{50%{transform:scale(1.06)}}
.belt{position:relative;height:56px;border-radius:14px;background:repeating-linear-gradient(90deg,rgba(18,50,74,.1) 0 18px,rgba(18,50,74,.03) 18px 36px);border:1px solid var(--stroke);overflow:hidden}
.belt.run{animation:beltmove .5s linear infinite}
@keyframes beltmove{to{background-position:36px 0}}
.belt .item{position:absolute;top:6px;left:6px;font-size:34px;transition:left 1.4s cubic-bezier(.5,0,.3,1);filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.dest{height:110px;border-radius:18px;border:2px dashed rgba(18,50,74,.25);display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);padding:6px}
.dest.got{border-color:var(--ok);color:#047857;background:rgba(16,185,129,.1)}
.minicode{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--code-bg);color:var(--code-tx);border-radius:10px;padding:8px 12px;margin:8px 0}
.minicode em{color:#bef264;font-style:normal}
.uml{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;margin:12px 0;position:relative}
.role{cursor:pointer;border-radius:16px;padding:12px 14px;border:1px solid var(--stroke);background:rgba(255,255,255,.65);transition:.25s;position:relative}
.role:hover{transform:translateY(-2px)}
.role.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 26px rgba(30,90,120,.2)}
.role .rn{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.8}
.role .rc{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;margin-top:2px}
.role.parent::after{content:"▼";position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.5;color:var(--text)}
.roledesc{min-height:52px;border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.65);border:1px solid var(--stroke);font-size:15px}
.classes{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.cls{font-family:'JetBrains Mono',monospace;font-size:13px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid var(--stroke);position:relative;transition:.3s}
.cls .badge{position:absolute;top:-9px;right:-6px;font-family:Outfit;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.cls.untouched .badge{background:var(--ok);color:#fff}
.cls.new{background:var(--grad);border-color:transparent;color:#fff;animation:flyin .6s cubic-bezier(.2,.9,.3,1.3)}
.cls.new .badge{background:#facc15;color:#422006}
@keyframes flyin{from{opacity:0;transform:translateY(-30px) scale(.6) rotate(-8deg)}}

/* AF sims */
.room{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.furn{border-radius:18px;padding:16px;text-align:center;border:1px solid var(--stroke);transition:.4s;position:relative;overflow:hidden}
.furn .em{font-size:54px;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));transition:.4s}
.furn .nm{font-family:'JetBrains Mono',monospace;font-weight:600;margin-top:4px}
.sty-modern{background:linear-gradient(135deg,rgba(34,184,204,.35),rgba(255,255,255,.6))}
.sty-victorian{background:linear-gradient(135deg,rgba(168,120,240,.35),rgba(251,191,36,.3))}
.sty-space{background:linear-gradient(135deg,rgba(249,115,98,.35),rgba(108,140,255,.25))}
.sty-victorian .em{transform:rotate(-6deg)}
.sty-space .em{transform:scale(1.1)}
.room.bad .furn{animation:shake .5s}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;user-select:none}
.toggle input{display:none}
.toggle .sw{width:46px;height:26px;border-radius:999px;background:rgba(18,50,74,.18);position:relative;transition:.3s}
.toggle .sw::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.toggle input:checked + .sw{background:var(--grad-ok)}
.toggle input:checked + .sw::after{left:23px}
#furn3d{height:330px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.85),rgba(186,230,240,.5));cursor:grab;position:relative;border:1px solid var(--stroke)}
#furn3d canvas{display:block;width:100%!important;height:100%!important}
#furn3d .hint{position:absolute;bottom:8px;right:12px;font-size:12px;color:var(--muted);pointer-events:none}
.matrix{width:100%;border-collapse:separate;border-spacing:6px;margin:8px 0}
.matrix th,.matrix td{border-radius:12px;padding:10px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;transition:.25s}
.matrix th{background:rgba(255,255,255,.75);cursor:pointer;font-family:Outfit;font-size:14px}
.matrix th:hover{background:#fff}
.matrix td{background:rgba(255,255,255,.4);cursor:pointer;border:1px solid transparent}
.matrix .lit{background:var(--grad)!important;color:#fff;transform:scale(1.03);box-shadow:0 6px 18px rgba(30,90,120,.2)}
.matrix th.corner{background:none;cursor:default}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vs .card h3{margin:0 0 8px;font-size:19px}
.vs ul{margin:0;padding-left:18px;line-height:1.7}
.vs .fmc{background:linear-gradient(135deg,rgba(249,115,98,.16),rgba(245,161,66,.08)),rgba(255,255,255,.5)}

<script>
/* ============ Utilities ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const KW = new Set('abstract class interface implements extends new return void public private protected static final var record sealed permits switch case default throw if else this super null true false boolean int double'.split(' '));
function hl(src){
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(@\w+)|\b([A-Za-z_]\w*)\b|(->)/gm;
  let out='', last=0, m;
  while((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    if(m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if(m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if(m[3]) out += `<span class="a">${m[3]}</span>`;
    else if(m[4]){
      const w = m[4];
      if(KW.has(w)) out += `<span class="k">${w}</span>`;
      else if(/^[A-Z]/.test(w)) out += `<span class="t">${w}</span>`;
      else if(src[re.lastIndex] === '(') out += `<span class="f">${w}</span>`;
      else out += w;
    } else out += `<span class="k">-&gt;</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeBlock(src, opts={}){
  const lines = src.split('\n');
  const body = lines.map((l,i)=>`<div class="ln" data-i="${i}"><span class="no">${i+1}</span><span class="tx">${hl(l)||' '}</span></div>`).join('');
  return `<div class="code ${opts.cls||''}" ${opts.id?`id="${opts.id}"`:''}><div class="code-head">☕ ${opts.file||'Main.java'}<button class="copy" data-copy="${encodeURIComponent(src)}">Copy</button></div><pre>${body}</pre></div>`;
}
document.addEventListener('click', e=>{
  const b = e.target.closest('.copy'); if(!b) return;
  const txt = decodeURIComponent(b.dataset.copy);
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{b.textContent='Copied ✓'; setTimeout(()=>b.textContent='Copy',1400);}).catch(()=>{b.textContent='Select & copy manually';});
});
const findLine = (src, sub) => src.split('\n').findIndex(l => l.includes(sub));
function blockLines(src, startSub){
  const L = src.split('\n'); const s = L.findIndex(l=>l.includes(startSub)); if(s<0) return [];
  const out=[s]; if(L[s].trim().endsWith('}') && !L[s].trim().endsWith('{')) return out;
  for(let i=s+1;i<L.length;i++){ out.push(i); if(L[i].startsWith('}')) break; }
  return out;
}

/* ============ Progress / XP ============ */
const STORE='factory-lab-v2';
let P = {q:{}, e:{}, xp:0, air:false, w:'fm-learn'};
try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s) P = Object.assign(P, s); }catch(e){}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(P)); }catch(e){} updateHUD(); }
function addXP(n, msg){ P.xp += n; save(); toast(`+${n} XP · ${msg}`); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }

/* ============ Confetti ============ */
const cf = $('#confetti'), cx = cf.getContext('2d'); let parts=[], cfRun=false;
function confetti(x=innerWidth/2, y=innerHeight/2){
  if(reduced) return;
  cf.width=innerWidth; cf.height=innerHeight;
  const cols=({winter:['#ffffff','#bfdbfe','#60a5fa','#a5b4fc','#7dd3fc','#c4b5fd'],autumn:['#f59f00','#e8590c','#c92a2a','#a0522d','#fab005','#d9480f'],spring:['#f9a8d4','#f472b6','#86efac','#fde047','#c4b5fd','#34d399'],summer:['#fbbf24','#06b6d4','#fb7185','#34d399','#f97316','#38bdf8']})[document.body.dataset.season]||['#f472b6','#fb923c','#facc15','#22d3ee','#a78bfa','#34d399'];
  for(let i=0;i<90;i++) parts.push({x,y,vx:(Math.random()-.5)*12,vy:Math.random()*-11-3,g:.35,s:Math.random()*7+4,c:cols[i%6],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:90});
  if(!cfRun){ cfRun=true; requestAnimationFrame(cfTick); }
}
function cfTick(){
  cx.clearRect(0,0,cf.width,cf.height);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=Math.max(0,p.life/90); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); });
  parts = parts.filter(p=>p.life>0);
  if(parts.length) requestAnimationFrame(cfTick); else { cfRun=false; cx.clearRect(0,0,cf.width,cf.height); }
}

function quizHTML(q, key){
  const solved = P.q[key];
  return `<div class="quiz" data-key="${key}">

    <div class="q">${q.q}</div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt ${solved&&i===q.a?'right':''}" data-i="${i}" ${solved?'disabled':''}><span class="L">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="fb ${solved?'show good':''}">${solved?'✅ '+q.why:''}</div>
  </div>`;
}
function bindQuiz(root, q, key, onPass){
  const box = $('.quiz', root); if(!box) return;
  $$('.opt', box).forEach(b=>b.addEventListener('click', e=>{
    const i = +b.dataset.i, fb = $('.fb', box);
    if(i === q.a){
      b.classList.add('right'); $$('.opt',box).forEach(x=>x.disabled=true);
      fb.className='fb show good'; fb.innerHTML='✅ <b>Correct!</b> '+q.why;
      if(!P.q[key]){ P.q[key]=true; addXP(10,'quiz passed'); }
      confetti(e.clientX, e.clientY); onPass && onPass();

      b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); b.disabled=true;
      fb.className='fb show badf'; fb.innerHTML='❌ Not quite. '+(q.hint||'Re-read the idea above and try again.');
    }
  }));
}

/* ============ Lesson engine ============ */
function Lesson(cfg){
  let idx = 0;
  const qk = i => cfg.key+'-'+cfg.steps[i].id;
  const passed = i => !cfg.steps[i].quiz || P.q[qk(i)];
  function firstOpen(){ let i=0; while(i<cfg.steps.length-1 && passed(i)) i++; return i; }
  idx = firstOpen();
  function render(el){
    const s = cfg.steps[idx];
    const side = cfg.steps.map((st,i)=>{
      const locked = !cfg.steps.slice(0,i).every((_,j)=>passed(j));
      const done = st.quiz ? P.q[qk(i)] : (i<idx || (i===idx && i===cfg.steps.length-1 && passed(i-1)));
      return `<button class="stepbtn ${i===idx?'cur':''} ${done?'done':''}" data-i="${i}" ${locked?'disabled':''}><span class="n">${done?'✓':i+1}</span><span class="lab">${st.t}</span></button>`;
    }).join('');
    el.innerHTML = `<div class="window">
      <div class="titlebar"><div class="dots"><i></i><i></i><i></i></div><div class="wt">${cfg.title}</div><span class="seachip">${SEASON_INFO[cfg.season]}</span><div class="ws">Step ${idx+1} / ${cfg.steps.length}</div></div>
      <div class="wbody"><aside class="side"><h4>Lessons</h4>${side}</aside>
      <section class="main"><div class="kicker">Step ${idx+1}</div><h2 class="st">${s.h}</h2>
        <div class="content">${s.html()}</div>
        ${s.quiz?quizHTML(s.quiz, qk(idx)):''}
        <div class="navrow"><button class="btn ghost" id="prev" ${idx===0?'disabled':''}>← Back</button>
        ${idx<cfg.steps.length-1?`<button class="btn" id="next" ${passed(idx)?'':'disabled'}>Next →</button>`:`<button class="btn" id="practice">Start the exercises ⌨️</button>`}</div>
      </section></div></div>`;
    const main = $('.main', el);
    s.init && s.init(main);
    if(s.quiz) bindQuiz(main, s.quiz, qk(idx), ()=>{ const n=$('#next',el); if(n) n.disabled=false; $$('.stepbtn',el).forEach(b=>{ if(+b.dataset.i===idx+1) b.disabled=false; }); updateHUD(); });
    $$('.stepbtn', el).forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; render(el); scrollTop(); });
    const pv=$('#prev',el); if(pv) pv.onclick=()=>{ idx--; render(el); scrollTop(); };
    const nx=$('#next',el); if(nx) nx.onclick=()=>{ idx++; render(el); scrollTop(); };
    const pr=$('#practice',el); if(pr) pr.onclick=()=>go(cfg.practice);
    reveal();
  }
  return { render };
}
function scrollTop(){ const w=$('#win'); const y=w.getBoundingClientRect().top+scrollY-10; if(scrollY>y) scrollTo({top:y,behavior:reduced?'auto':'smooth'}); }

/* ============ Class diagram engine (before → after) ============ */
const ROLES = {
  plain:{n:'Plain class (no pattern)',c:'#94a3b8'}, client:{n:'Client',c:'#64748b'},
  product:{n:'Product (interface)',c:'#1fb5c9'}, cproduct:{n:'Concrete Product',c:'#3fbfa6'},
  creator:{n:'Creator',c:'#f97362'}, ccreator:{n:'Concrete Creator',c:'#f5a142'},
  afactory:{n:'Abstract Factory',c:'#6c8cff'}, cfactory:{n:'Concrete Factory',c:'#9b7bf0'},
  aproduct:{n:'Abstract Product',c:'#1fb5c9'}
};
const RELS = {
  implements:{c:'#6c8cff',dash:'5 4',m:'tri',n:'implements'}, extends:{c:'#12324a',dash:'',m:'tri',n:'extends'},
  creates:{c:'#f97362',dash:'7 5',m:'arr',flow:1,n:'creates'}, uses:{c:'#1fb5c9',dash:'',m:'arr',n:'uses'},
  bad:{c:'#f43f5e',dash:'7 5',m:'arr',flow:1,n:'creates directly ❌'}
};
const bh = b => (b.st?42:30) + 10 + b.m.length*17 + 4;
function umlSVG(model){
  const B = Object.fromEntries(model.boxes.map(b=>[b.id,b]));
  const mk = new Map();
  const markerId=(type,col)=>{ const id=('mk-'+RELS[type].m+col).replace(/[^a-z0-9-]/gi,''); mk.set(id,[RELS[type].m,col]); return id; };
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  function pts(a,b){
    const ah=bh(a),bb=bh(b),acx=a.x+a.w/2,bcx=b.x+b.w/2;
    if(a.y>=b.y+bb+10) return [cl(bcx,a.x+16,a.x+a.w-16),a.y,cl(acx,b.x+16,b.x+b.w-16),b.y+bb];
    if(b.y>=a.y+ah+10) return [cl(bcx,a.x+16,a.x+a.w-16),a.y+ah,cl(acx,b.x+16,b.x+b.w-16),b.y];
    return bcx>acx?[a.x+a.w,a.y+ah/2,b.x,b.y+bb/2]:[a.x,a.y+ah/2,b.x+b.w,b.y+bb/2];
  }
  const rels = model.rels.map((r,i)=>{
    const a=B[r.f], b=B[r.t], T=RELS[r.type], col=r.c||T.c; let d, lx, ly;
    if(r.curve){ const x1=a.x+a.w/2,y1=a.y+bh(a),x2=b.x+b.w/2,y2=b.y+bh(b);
      d=`M${x1},${y1} C${x1},${y1+r.curve} ${x2},${y2+r.curve} ${x2},${y2+4}`; lx=(x1+x2)/2; ly=Math.max(y1,y2)+r.curve*.72;
    } else { const [x1,y1,x2,y2]=pts(a,b); d=`M${x1},${y1} L${x2},${y2}`; lx=(x1+x2)/2; ly=(y1+y2)/2; }
    const lab=r.label||T.n, lw=lab.length*6.4+14;
    return `<g class="rel ${T.flow?'flow':''}" data-f="${r.f}" data-t="${r.t}" style="animation-delay:${400+i*70}ms">
      <path class="ln" d="${d}" fill="none" stroke="${col}" stroke-width="2" ${T.dash&&!T.flow?`stroke-dasharray="${T.dash}"`:''} marker-end="url(#${markerId(r.type,col)})"/>
      <g transform="translate(${lx},${ly})"><rect x="${-lw/2}" y="-10" width="${lw}" height="20" rx="10" fill="rgba(255,255,255,.92)" stroke="${col}" stroke-opacity=".5"/><text text-anchor="middle" y="4" font-size="11" font-weight="600" fill="${col}">${lab}</text></g></g>`;
  }).join('');
  const boxes = model.boxes.map((b,i)=>{
    const h=bh(b), R=ROLES[b.role], hh=b.st?42:30;
    const tag = b.tag ? `<g transform="translate(${b.x+b.w-58},${b.y-10})"><rect width="64" height="20" rx="10" fill="${b.tag==='new'?'#facc15':'#6c8cff'}"/><text x="32" y="14" text-anchor="middle" font-size="10.5" font-weight="800" fill="${b.tag==='new'?'#422006':'#fff'}">${b.tag==='new'?'✨ NEW':'✎ CHANGED'}</text></g>` : '';
    return `<g class="ub" data-id="${b.id}" style="animation-delay:${i*80}ms">
      <rect class="body" x="${b.x}" y="${b.y}" width="${b.w}" height="${h}" rx="12"/>
      <path d="M${b.x},${b.y+12} a12,12 0 0 1 12,-12 h${b.w-24} a12,12 0 0 1 12,12 v${hh-12} h${-b.w} z" fill="${R.c}"/>
      ${b.st?`<text x="${b.x+b.w/2}" y="${b.y+16}" text-anchor="middle" font-size="11" font-style="italic" fill="#fff" opacity=".92">«${b.st}»</text>`:''}
      <text x="${b.x+b.w/2}" y="${b.y+(b.st?34:20)}" text-anchor="middle" font-size="14.5" font-weight="800" fill="#fff">${b.name}</text>
      ${b.m.map((m,j)=>`<text x="${b.x+12}" y="${b.y+hh+20+j*17}" font-family="JetBrains Mono,monospace" font-size="12" fill="${m.trim().startsWith('↳')||m.includes('new ')?'#b45309':'#12324a'}" xml:space="preserve">${esc(m)}</text>`).join('')}
      ${tag}</g>`;
  }).join('');
  const notes=(model.notes||[]).map(n=>`<text x="${n.x}" y="${n.y}" font-size="14" font-weight="700" fill="${n.c||'#f43f5e'}">${n.t}</text>`).join('');
  const defs=[...mk].map(([id,[m,c]])=> m==='tri'
    ? `<marker id="${id}" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L13,7 L1,13 z" fill="#fff" stroke="${c}" stroke-width="1.6"/></marker>`
    : `<marker id="${id}" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="${c}" stroke-width="1.8"/></marker>`).join('');
  return `<svg viewBox="0 0 ${model.w} ${model.h}" font-family="Outfit,sans-serif"><defs>${defs}</defs>${rels}${boxes}${notes}</svg>`;
}
function umlLegend(model){
  const roles=[...new Set(model.boxes.map(b=>b.role))], types=[...new Set(model.rels.map(r=>r.type))];
  return roles.map(r=>`<span><i style="background:${ROLES[r].c}"></i>${ROLES[r].n}</span>`).join('') +
    types.map(t=>`<span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="${RELS[t].c}" stroke-width="2" ${RELS[t].dash?`stroke-dasharray="${RELS[t].dash}"`:''}/><path d="${RELS[t].m==='tri'?'M24,0 L33,5 L24,10 z':'M25,1 L33,5 L25,9'}" fill="${RELS[t].m==='tri'?'#fff':'none'}" stroke="${RELS[t].c}" stroke-width="1.5"/></svg>${RELS[t].n}</span>`).join('');
}

  <div class="umlwrap" id="uml"></div><div class="legend" id="umllg"></div><div class="roledesc" id="umlinfo"></div>`; }
function umlInit(root, M){
  let mode='before', sel=null, timer=null;
  const info=$('#umlinfo',root);
  function draw(){
    const model=M[mode]; sel=null;
    $('#uml',root).innerHTML=umlSVG(model); $('#umllg',root).innerHTML=umlLegend(model); info.innerHTML=model.summary;
    $$('.modebar .chip',root).forEach(c=>c.classList.toggle('on',c.dataset.m===mode));

      const id=g.dataset.id, b=model.boxes.find(x=>x.id===id);
      if(sel===id){ sel=null; $$('#uml .ub, #uml .rel',root).forEach(x=>x.classList.remove('dim','sel')); info.innerHTML=model.summary; return; }
      sel=id;
      const linked=new Set([id]); const rs=model.rels.filter(r=>r.f===id||r.t===id); rs.forEach(r=>{linked.add(r.f);linked.add(r.t);});
      $$('#uml .ub',root).forEach(x=>{ x.classList.toggle('dim',!linked.has(x.dataset.id)); x.classList.toggle('sel',x.dataset.id===id); });
      $$('#uml .rel',root).forEach(x=>x.classList.toggle('dim',!(x.dataset.f===id||x.dataset.t===id)));
      const name=k=>model.boxes.find(x=>x.id===k).name;
      info.innerHTML=`<span class="rolechip" style="background:${ROLES[b.role].c}">${ROLES[b.role].n}</span> <b>${b.name}</b>${b.tag?` <span class="tagchip ${b.tag}">${b.tag==='new'?'✨ new':'✎ changed'}</span>`:''}<div style="margin-top:6px">${b.desc}</div>`+
        (rs.length?`<div class="rellist">${rs.map(r=>`<code class="i">${name(r.f)}</code> <b style="color:${r.c||RELS[r.type].c}">${r.label||RELS[r.type].n}</b> <code class="i">${name(r.t)}</code>`).join('<br>')}</div>`:'');
    }));
  }
  $$('.modebar .chip',root).forEach(c=>c.onclick=()=>{ clearTimeout(timer); mode=c.dataset.m; draw(); });
  $('#umlplay',root).onclick=()=>{ clearTimeout(timer); mode='before'; draw(); timer=setTimeout(()=>{ mode='after'; draw(); },2600); };
  draw();
}

const CH = ['What new does','Version 1','Change requests','The root cause','What we need'];
function fmProblemHTML(){
  return `<p>Before learning the pattern, let’s see exactly <b>what goes wrong</b> without it. Go through the five short parts below.</p>
  <div class="chapnav" role="tablist">${CH.map((c,i)=>`<button class="chap" data-c="${i}" role="tab"><span>${i+1}</span>${c}</button>`).join('')}</div>
  <div class="chapters">
   <section class="chapter" data-c="0">
     <h3>What does <code class="i">new</code> actually do?</h3>
     <p><code class="i">new</code> creates an object of <b>one exact class</b>. You choose that class while writing the code, and it can’t change while the program runs.</p>
     <div class="anat">
       <div class="a1"><code>Truck</code><small>the type of the variable</small></div>
       <div class="a2"><code>truck</code><small>its name</small></div>
       <div class="a3"><code>= new Truck();</code><small><b>the exact class to build</b>, written in stone</small></div>
     </div>
     <div class="analogy"><div class="ic">💡</div><div><b>Analogy.</b> A lamp wired straight into the wall versus a lamp with a plug. With the wires twisted into the wall, changing the lamp means opening the wall. With a socket, the wall only expects “something with a plug”, and any lamp fits. <br><code class="i">new Truck()</code> inside your code is the wired-in lamp.</div></div>
   </section>
   <section class="chapter" data-c="1">
     <h3>Version 1: only trucks</h3>
     <p>The app is small. One kind of transport, one place that creates it. This is <b>perfectly fine</b>.</p>
     ${codeBlock(FM_V[0].code,{file:'Logistics.java · v1'})}
     <p>So where is the problem? It isn’t in this code. It appears the moment the requirements <b>change</b>, which in real projects happens all the time.</p>
   </section>
   <section class="chapter" data-c="2">
     <h3>Watch the code grow, request after request</h3>
     <div class="vbar">${FM_V.map((v,i)=>`<button class="chip" data-v="${i}">${v.label}</button>`).join('')}<button class="btn ghost sm" id="vplay">▶ Play the history</button></div>
     <div class="meters" id="meters"></div>
     <div id="vcode"></div>
     <div class="roledesc" id="vnote"></div>
     <p class="legendline"><span class="sw add"></span> lines you had to add to <b>old, working code</b></p>
   </section>
   <section class="chapter" data-c="3">
     <h3>The root cause: one class doing two jobs</h3>
     <p><code class="i">Logistics</code> should only <b>use</b> transports (deliver, price, track). But it also <b>decides which class</b> to use and <b>creates</b> it. Turn on each colour to see the jobs mixed together.</p>
     <div class="jobs"><button class="job dec" data-j="dec">Decides which class</button><button class="job cre" data-j="cre">Creates the object</button><button class="job use" data-j="use">Uses the object</button></div>
     <div id="jobcode"></div>
     <div class="roledesc" id="jobnote">Turn on the three colours one by one.</div>
   </section>
   <section class="chapter" data-c="4">
     <h3>So, what do we need?</h3>
     <p><code class="i">new</code> is not the enemy. Every object is created with <code class="i">new</code> somewhere. The problem is <b>where</b> it is written and <b>who</b> decides the class.</p>
     <div class="needs">
       <div><b>1. Code that uses a transport talks to an interface</b><p>It only knows <code class="i">Transport</code>, never <code class="i">Truck</code> or <code class="i">Ship</code>.</p></div>
       <div><b>2. Creating is moved out of the using code</b><p>The choice of class lives in one place made for that job.</p></div>
       <div><b>3. A new transport means a new class</b><p>Old, tested code stays untouched.</p></div>
     </div>
     <p>That is exactly what the <b>Factory Method</b> pattern gives us. Let’s see how it works in the next step.</p>
   </section>
  </div>
  <div class="chapfoot"><button class="btn ghost sm" id="chprev">Previous part</button><span id="chpos"></span><button class="btn sm" id="chnext">Next part</button></div>`;
}
function fmProblemInit(r){
  const quiz=$('.quiz',r), nav=$('.navrow',r);
  let c=0, seen=P.q['fm-problem']?CH.length-1:0, v=0, timer=null; const jobs=new Set();
  const nz=x=>x.replace(/\s+/g,''); const lineInfo=(code,prev)=>{ const ps=new Set(prev?prev.split('\n').map(nz):[]); return code.split('\n').map(l=>({add:prev!=null&&!!nz(l)&&!ps.has(nz(l))})); };
  function showV(i){
    v=i; const V=FM_V[i], prev=i?FM_V[i-1].code:null, info=lineInfo(V.code,prev);
    $('#vcode',r).innerHTML=codeBlock(V.code,{file:'Logistics.java · '+V.label.split(' ·')[0]});
    $$('#vcode .ln',r).forEach((l,k)=>{ if(info[k].add) l.classList.add('add'); });
    const knows=new Set((V.code.match(/new (\w+)\(/g)||[]).map(x=>x).filter(x=>!x.includes('Illegal'))).size;
    const br=(V.code.match(/type\.equals/g)||[]).length, added=info.filter(x=>x.add).length;
    const M=[['Concrete classes Logistics knows',knows,4],['if / else branches',br,13],['Lines added to existing code',added,22]];
    $('#meters',r).innerHTML=M.map(([n,val,max])=>`<div class="meter"><div class="mv">${val}</div><div class="mn">${n}</div><div class="mb"><i style="width:${Math.min(100,val/max*100)}%"></i></div></div>`).join('');
    $('#vnote',r).innerHTML=V.note;
    $$('.vbar .chip',r).forEach(b=>b.classList.toggle('on',+b.dataset.v===i));
  }
  function paintJobs(){
    $$('#jobcode .ln',r).forEach(l=>{ const t=l.textContent;
      const k = /new (?!Illegal)\w+\(/.test(t) ? 'cre' : /type\.equals|throw new/.test(t) ? 'dec' : /\.deliver\(|return km|gpsPosition/.test(t) ? 'use' : '';
      ['dec','cre','use'].forEach(x=>l.classList.toggle('j-'+x, k===x && jobs.has(x))); });
    const notes={dec:'<b>Purple</b>: deciding which class. This logic is <b>repeated</b> in three methods.',cre:'<b>Orange</b>: creating objects with <code class="i">new</code>. Logistics is welded to 4 concrete classes.',use:'<b>Blue</b>: actually using the transport. This is the <b>only</b> job Logistics should have.'};
    $('#jobnote',r).innerHTML = jobs.size===3 ? '🎯 <b>Only the blue lines are Logistics’ real job.</b> Purple and orange are mixed in, which is why <i>every</i> new transport forces you to edit this class. Factory Method moves the purple and orange parts out.' : [...jobs].map(j=>notes[j]).join('<br>') || 'Turn on the three colours one by one.';
  }
  function go(i){
    c=i; seen=Math.max(seen,i);
    $$('.chapter',r).forEach(s=>s.classList.toggle('on',+s.dataset.c===c));
    $$('.chap',r).forEach(b=>{ const k=+b.dataset.c; b.classList.toggle('on',k===c); b.classList.toggle('done',k<=seen&&k!==c); b.disabled=k>seen+1; });
    $('#chpos',r).textContent=`Part ${c+1} of ${CH.length}`;
    $('#chprev',r).disabled=c===0; const n=$('#chnext',r); n.style.visibility=c===CH.length-1?'hidden':'visible';
    const done=seen>=CH.length-1; if(quiz) quiz.style.display=done?'':'none'; if(nav) nav.style.display=done?'':'none';
    if(done && quiz && !quiz.dataset.shown){ quiz.dataset.shown=1; quiz.classList.add('rv','in'); }
  }
  $$('.chap',r).forEach(b=>b.onclick=()=>go(+b.dataset.c));
  $('#chprev',r).onclick=()=>go(c-1); $('#chnext',r).onclick=()=>{ go(c+1); $('.chapnav',r).scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'}); };
  $$('.vbar .chip',r).forEach(b=>b.onclick=()=>{ clearTimeout(timer); showV(+b.dataset.v); });
  $('#vplay',r).onclick=()=>{ clearTimeout(timer); let i=0; const step=()=>{ showV(i); if(++i<FM_V.length) timer=setTimeout(step,2600); }; step(); };
  $('#jobcode',r).innerHTML=codeBlock(FM_V[3].code,{file:'Logistics.java · v4'});
  $$('.job',r).forEach(b=>b.onclick=()=>{ const j=b.dataset.j; jobs.has(j)?jobs.delete(j):jobs.add(j); b.classList.toggle('on',jobs.has(j)); paintJobs(); });
  showV(0); go(0);
}

/* ============ 3D furniture (Three.js) ============ */
const Furn3D = (()=>{
  let R, scene, cam, cur, old, t0=0, oldT0=0, raf=null, host, rotY=.5, drag=false, lx=0;
  function init(){
    if(!window.THREE) return false;
    try{ R=new THREE.WebGLRenderer({antialias:true,alpha:true}); }catch(e){ return false; }
    R.setPixelRatio(Math.min(devicePixelRatio,2));
    scene=new THREE.Scene(); cam=new THREE.PerspectiveCamera(38,2,.1,100); cam.position.set(0,3.4,8.2);scene.background=null; cam.lookAt(0,.8,0);
    scene.add(new THREE.AmbientLight(0xffffff,.55));
    const d=new THREE.DirectionalLight(0xffffff,.9); d.position.set(3,6,4); scene.add(d);
    const p1=new THREE.PointLight(0xf472b6,1.2,20); p1.position.set(-4,3,3); scene.add(p1);
    const p2=new THREE.PointLight(0x22d3ee,1.2,20); p2.position.set(4,2,3); scene.add(p2);
    const floor=new THREE.Mesh(new THREE.CircleGeometry(3.6,64),new THREE.MeshStandardMaterial({color:0x7dd3e0,transparent:true,opacity:.35,roughness:.3}));
    floor.rotation.x=-Math.PI/2; scene.add(floor);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(3.6,.03,8,96),new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:.7}));
    ring.rotation.x=Math.PI/2; scene.add(ring);
    const c=R.domElement;
    c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;c.setPointerCapture(e.pointerId);});
    c.addEventListener('pointermove',e=>{ if(drag){ rotY+=(e.clientX-lx)*.01; lx=e.clientX; }});
    c.addEventListener('pointerup',()=>drag=false);
    return true;
  }
  const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,metalness:o.m??.25,roughness:o.r??.35,emissive:o.e??0,emissiveIntensity:o.ei??.8,transparent:true,opacity:o.op??.95});
  const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  const cyl=(a,b,h,m)=>new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,28),m);
  const sph=(r,m)=>new THREE.Mesh(new THREE.SphereGeometry(r,24,16),m);
  const at=(o,x,y,z)=>{o.position.set(x,y,z);return o;};
  function chair(s){
    const g=new THREE.Group();
    if(s==='modern'){ const a=M(0x22d3ee),metal=M(0xe2e8f0,{m:.9,r:.15});
      g.add(at(box(1,.12,1,a),0,.9,0), at(box(1,1,.1,a),0,1.45,-.45));
      [[-.42,-.42],[.42,-.42],[-.42,.42],[.42,.42]].forEach(([x,z])=>g.add(at(cyl(.035,.035,.9,metal),x,.45,z)));
    } else if(s==='victorian'){ const a=M(0xa855f7,{r:.6}),gold=M(0xfbbf24,{m:.85,r:.25});
      g.add(at(box(1.05,.2,1.05,a),0,.9,0), at(box(1,1.15,.12,a),0,1.55,-.46));
      const t=new THREE.Mesh(new THREE.TorusGeometry(.26,.055,12,40),gold); g.add(at(t,0,1.62,-.38));
      [[-.42,-.42],[.42,-.42],[-.42,.42],[.42,.42]].forEach(([x,z])=>{ g.add(at(cyl(.07,.035,.8,gold),x,.4,z)); g.add(at(sph(.09,gold),x,.82,z)); });
      g.add(at(sph(.1,gold),-.5,2.15,-.46), at(sph(.1,gold),.5,2.15,-.46));
    } else { const a=M(0xf472b6,{m:.4,r:.2}),dark=M(0x312e81,{m:.6}),glow=M(0x22d3ee,{e:0x22d3ee});
      g.add(at(cyl(.6,.6,.15,a),0,.9,0));
      const back=cyl(.6,.6,.1,a); back.rotation.x=Math.PI/2; g.add(at(back,0,1.55,-.52));
      g.add(at(cyl(.08,.3,.85,dark),0,.42,0), at(sph(.13,glow),0,1.55,-.45), at(new THREE.Mesh(new THREE.TorusGeometry(.6,.03,8,48),glow),0,.97,0));
      g.children[g.children.length-1].rotation.x=Math.PI/2;
    }
    return g;
  }
  function sofa(s){
    const g=new THREE.Group();
    if(s==='modern'){ const a=M(0x22d3ee),b=M(0x0e7490),metal=M(0xe2e8f0,{m:.9,r:.15});
      g.add(at(box(2.4,.45,1,a),0,.45,0), at(box(2.4,.7,.2,b),0,1.0,-.4), at(box(.2,.55,1,b),-1.2,.75,0), at(box(.2,.55,1,b),1.2,.75,0));
      [[-1.1,-.4],[1.1,-.4],[-1.1,.4],[1.1,.4]].forEach(([x,z])=>g.add(at(cyl(.035,.035,.22,metal),x,.11,z)));
    } else if(s==='victorian'){ const a=M(0xa855f7,{r:.6}),gold=M(0xfbbf24,{m:.85,r:.25});
      g.add(at(box(2.4,.5,1.05,a),0,.5,0), at(box(2.4,.95,.2,a),0,1.2,-.42), at(box(.25,.6,1.05,a),-1.25,.8,0), at(box(.25,.6,1.05,a),1.25,.8,0));
      g.add(at(sph(.14,gold),-1.25,1.17,.35), at(sph(.14,gold),1.25,1.17,.35));
      const t=new THREE.Mesh(new THREE.TorusGeometry(.3,.06,12,40),gold); g.add(at(t,0,1.35,-.3));
      [[-1.1,-.4],[1.1,-.4],[-1.1,.4],[1.1,.4]].forEach(([x,z])=>g.add(at(cyl(.08,.04,.25,gold),x,.12,z)));
    } else { const a=M(0xf472b6,{m:.4,r:.2}),glow=M(0x22d3ee,{e:0x22d3ee,ei:.6});
      g.add(at(box(2.2,.45,1,a),0,.55,0), at(box(2.2,.65,.2,a),0,1.05,-.42), at(sph(.38,glow),-1.3,.65,0), at(sph(.38,glow),1.3,.65,0));
      const base=cyl(.9,.9,.12,M(0x312e81,{m:.6})); base.scale.set(1.3,1,.6); g.add(at(base,0,.2,0));
    }
    return g;
  }
  function build(s){ const g=new THREE.Group(); const c=chair(s), so=sofa(s); c.position.x=-2.05; c.rotation.y=.35; so.position.x=.9; g.add(c,so); return g; }
  function resize(){ if(!host) return; const w=host.clientWidth||600, h=host.clientHeight||330; R.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
  const bounce=x=>{ const n=7.5625,d=2.75; if(x<1/d) return n*x*x; if(x<2/d) return n*(x-=1.5/d)*x+.75; if(x<2.5/d) return n*(x-=2.25/d)*x+.9375; return n*(x-=2.625/d)*x+.984375; };
  function loop(t){
    if(!host || !document.body.contains(host)){ raf=null; return; }
    if(!drag && !reduced) rotY+=.003;
    if(cur){ const k=Math.min(1,(t-t0)/900); cur.position.y=reduced?0:3.5*(1-bounce(k)); cur.rotation.y=rotY; }
    if(old){ const k=Math.min(1,(t-oldT0)/300); old.scale.setScalar(Math.max(.001,1-k)); old.rotation.y=rotY; if(k>=1){ scene.remove(old); old=null; } }
    R.render(scene,cam); raf=requestAnimationFrame(loop);
  }
  return {
    mount(el){ host=el; if(!R && !init()){ el.innerHTML='<div style="padding:20px">3D is not available in this browser — the code below still shows what each factory creates.</div>'; host=null; return; }
      el.appendChild(R.domElement); resize(); if(!raf) raf=requestAnimationFrame(loop); },
    show(s){ if(!R||!host) return; if(old) scene.remove(old); old=cur; oldT0=performance.now(); cur=build(s); scene.add(cur); t0=performance.now(); },
    resize
  };
})();
addEventListener('resize',()=>{ try{Furn3D.resize();}catch(e){} });

const norm = s => s.replace(/\s+/g,'');
function stripComments(s){ return s.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,''); }
function balanced(s){ let d=0; for(const ch of s){ if(ch==='{')d++; else if(ch==='}'){d--; if(d<0) return false;} } return d===0; }
function shuffle(a){ const b=a.slice(); do{ for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } }while(b.length>2 && b.every((x,i)=>x===a[i])); return b; }

function Exercises(cfg){

        ${idx<cfg.list.length-1?`<button class="btn ghost" id="nextl" style="margin-left:auto" ${solved(idx)?'':'disabled'}>Next level →</button>`:''}</div>

/* ============ Mouse spotlight on glass ============ */
addEventListener('pointermove',e=>{
  $$('.tab,.window').forEach(el=>{
    const r=el.getBoundingClientRect(), inside=e.clientX>=r.left-60&&e.clientX<=r.right+60&&e.clientY>=r.top-60&&e.clientY<=r.bottom+60;
    el.style.setProperty('--mx',(e.clientX-r.left)+'px'); el.style.setProperty('--my',(e.clientY-r.top)+'px'); el.style.setProperty('--spot',inside?1:0);
  });
},{passive:true});

/* ============ Scroll reveal ============ */
const RIO = ('IntersectionObserver' in window) ? new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); RIO.unobserve(en.target); } }),{threshold:.08,rootMargin:'0px 0px -30px 0px'}) : null;
function reveal(){
  if(!RIO || reduced) return;
  $$('#win .content > *, #win .quiz, #win .navrow, #win .task, #win #exbody, #win .exbtns, #win .done-banner').forEach((el,i)=>{
    if(el.classList.contains('rv')) return;
    el.classList.add('rv'); el.style.transitionDelay=Math.min(i*60,300)+'ms'; RIO.observe(el);
  });
  onScroll();
}

/* ============ Start ============ */
updateHUD();
go(W[location.hash.slice(1)] ? location.hash.slice(1) : (P.w||'fm-learn'));
